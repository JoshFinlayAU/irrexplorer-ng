# IRR Explorer NG. Copy .env.example to .env and set at least
# BGPTOOLS_USER_AGENT, then: docker compose up -d --build
#
# RPKI data comes from the RPKI source of the IRRd at IRRD_GRAPHQL_URL.
# Set MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY for GeoLite2 location, and
# optionally PEERINGDB_API_KEY for PeeringDB's higher query limit.
services:
  app:
    build: .
    image: irrexplorer-ng:latest
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '3000'
      # Keeps raw bulk downloads, the GeoLite2 database and the PeeringDB
      # mirror across restarts so bgp.tools is not fetched more than every 30
      # minutes, GeoLite2 only when MaxMind publishes a new release and
      # PeeringDB only for its changes. Safe to delete at any time.
      BULK_CACHE_DIR: /app/.cache
    volumes:
      - bulk-cache:/app/.cache

volumes:
  bulk-cache:
